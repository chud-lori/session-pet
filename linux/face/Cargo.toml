[package]
name = "session-pet-face"
version = "0.1.0"
edition = "2021"
description = "session-pet Linux face — native GTK renderer for the Python core"
license = "MIT"

# One tool, one name: the installed binary is `session-pet` on Linux, just
# as the app is SessionPet on macOS. Release assets add -linux-<arch>.
[[bin]]
name = "session-pet"
path = "src/main.rs"

[dependencies]
# GTK3 on purpose: GTK4 removed set_keep_above() and window positioning,
# both load-bearing for a floating desktop pet. GTK3 works on X11 and
# XWayland (incl. GNOME); pure-Wayland overlay via the layer-shell feature.
gtk = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gtk-layer-shell = { version = "0.8", optional = true }

[features]
layer-shell = ["dep:gtk-layer-shell"]

[profile.release]
strip = true
lto = true
opt-level = "z"
