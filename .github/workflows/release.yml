# Prebuilt binaries on every v* tag — same conventions as tangi:
# per-OS assets, downloadable via releases/latest/download/.
#
# Linux binaries are built WITHOUT the layer-shell feature on purpose: the
# only runtime deps stay python3 + the GTK3 runtime every desktop already
# ships. Wayland layer-shell users build from source with --layer-shell.
#
# The mac binary is a universal (arm64 + x86_64) build cross-compiled on the
# arm64 runner — the Intel macos-13 runner pool queues for 10min+ (tangi CI).
# It ships as a tarball with assets.json beside it in the layout the app
# expects (repo-root discovery: binary's parent dir's parent).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK3 dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev
      - name: Build
        run: cargo build --release --manifest-path linux/face/Cargo.toml
      - name: Rename asset
        run: cp linux/face/target/release/session-pet-linux
          session-pet-linux-${{ matrix.arch }}
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: session-pet-linux-${{ matrix.arch }}

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal binary
        run: |
          swiftc -O -target arm64-apple-macos13 native/src/*.swift -o SessionPet-arm64
          swiftc -O -target x86_64-apple-macos13 native/src/*.swift -o SessionPet-x86_64
          lipo -create -output SessionPet SessionPet-arm64 SessionPet-x86_64
      - name: Package tarball
        run: |
          mkdir -p session-pet/native
          cp SessionPet session-pet/native/SessionPet
          cp native/assets.json session-pet/native/
          tar -czf session-pet-macos.tar.gz session-pet
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: session-pet-macos.tar.gz
